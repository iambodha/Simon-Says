name: Simon
version: '${project.version}'
main: com.wonkyfingers.simon.Simon
api-version: '1.21'
description: Simon Says challenges inside a shrinking particle border.
author: iambodha
website: https://github.com/iambodha/Simon-Says
commands:
  startgame:
    description: Starts or restarts a game in your current world
    usage: /startgame
    permission: simon.admin
  stopgame:
    description: Stops the current game and cancels scheduled challenges
    aliases: [endgame]
    usage: /stopgame
    permission: simon.admin
permissions:
  simon.admin:
    description: Start and stop Simon Says games
    default: op
